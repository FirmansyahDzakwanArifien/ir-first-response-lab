name: Self-test

on:
  push:
    branches: [main]
    paths: ["irsim/**", "bank.sealed", "course.yml", "requirements.txt", ".github/workflows/selftest.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Uji seluruh skenario
        run: python -m irsim selftest -n 8
        env:
          IRSIM_KEY: ${{ secrets.IRSIM_KEY }}
          IRSIM_SEALED_ONLY: "1"
